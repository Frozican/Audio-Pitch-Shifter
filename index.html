<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Speed Shifter & Pitch Visualizer</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px 16px;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #121212;
            color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .container {
            width: 100%;
            max-width: 650px;
            padding: 30px;
            background: #1e1e1e;
            border: 1px solid #333;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.35);
        }

        h1 {
            margin: 0 0 25px;
            text-align: center;
            font-size: 26px;
        }

        .section {
            margin-bottom: 25px;
            padding: 20px;
            background: #282828;
            border-radius: 12px;
        }

        .section h2 {
            margin: 0 0 16px;
            font-size: 18px;
        }

        input[type="file"] {
            width: 100%;
            padding: 12px;
            background: #333;
            border: 1px solid #444;
            border-radius: 8px;
            color: #fff;
        }

        .file-name {
            margin-top: 10px;
            color: #aaa;
            font-size: 14px;
            overflow-wrap: anywhere;
        }

        .speed-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 15px;
        }

        .speed-value {
            font-size: 24px;
            font-weight: bold;
            color: #4cafef;
        }

        input[type="range"] {
            width: 100%;
            accent-color: #4cafef;
            cursor: pointer;
        }

        .range-labels {
            display: flex;
            justify-content: space-between;
            margin-top: 8px;
            color: #aaa;
            font-size: 12px;
        }

        .pitch-info {
            margin-top: 22px;
            text-align: center;
        }

        .pitch-value {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .pitch-bar-container {
            position: relative;
            width: 100%;
            height: 14px;
            background: #444;
            border-radius: 10px;
            overflow: hidden;
        }

        .pitch-center {
            position: absolute;
            top: 0;
            left: 50%;
            width: 2px;
            height: 100%;
            background: #fff;
            z-index: 2;
        }

        .pitch-bar {
            position: absolute;
            top: 0;
            height: 100%;
            width: 0;
            background: #4cafef;
            transition: width 0.1s ease, left 0.1s ease;
        }

        .pitch-description {
            margin-top: 10px;
            color: #aaa;
            font-size: 13px;
            text-align: center;
        }

        .controls {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }

        button {
            flex: 1;
            padding: 13px 16px;
            border: none;
            border-radius: 8px;
            background: #4cafef;
            color: #111;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover:not(:disabled) {
            background: #72c1f5;
        }

        button:disabled {
            background: #555;
            color: #aaa;
            cursor: not-allowed;
        }

        button.secondary {
            background: #444;
            color: #fff;
        }

        button.secondary:hover:not(:disabled) {
            background: #555;
        }

        .status {
            margin-top: 18px;
            min-height: 20px;
            color: #aaa;
            font-size: 14px;
            text-align: center;
            overflow-wrap: anywhere;
        }

        .status.error {
            color: #ff6b6b;
        }

        .status.success {
            color: #76d28b;
        }

        audio {
            display: none;
        }

        @media (max-width: 500px) {
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 22px;
            }

            .controls {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>
    <main class="container">
        <h1>Audio Speed Shifter</h1>

        <section class="section">
            <h2>Audio File</h2>

            <input
                type="file"
                id="fileInput"
                accept="audio/*"
            >

            <div class="file-name" id="fileName">
                No file selected
            </div>
        </section>

        <section class="section">
            <h2>Speed & Pitch</h2>

            <div class="speed-header">
                <label for="speedSlider">Playback Speed</label>
                <span class="speed-value" id="speedValue">100%</span>
            </div>

            <input
                type="range"
                id="speedSlider"
                min="0.5"
                max="2"
                step="0.05"
                value="1"
            >

            <div class="range-labels">
                <span>50%</span>
                <span>100%</span>
                <span>150%</span>
                <span>200%</span>
            </div>

            <div class="pitch-info">
                <div class="pitch-value" id="pitchValue">
                    0.00 semitones
                </div>

                <div class="pitch-bar-container">
                    <div class="pitch-center"></div>
                    <div class="pitch-bar" id="pitchBar"></div>
                </div>

                <div class="pitch-description">
                    Pitch changes naturally with playback speed.
                </div>
            </div>
        </section>

        <section class="section">
            <h2>Playback & Export</h2>

            <div class="controls">
                <button id="playButton" disabled>
                    Play
                </button>

                <button
                    id="stopButton"
                    class="secondary"
                    disabled
                >
                    Stop
                </button>
            </div>

            <div class="controls">
                <button id="exportButton" disabled>
                    Export as WAV
                </button>
            </div>

            <div class="status" id="status">
                Load an audio file to get started.
            </div>
        </section>

        <audio id="audioPlayer"></audio>
    </main>

    <script>
        const fileInput = document.getElementById("fileInput");
        const fileName = document.getElementById("fileName");
        const speedSlider = document.getElementById("speedSlider");
        const speedValue = document.getElementById("speedValue");
        const pitchValue = document.getElementById("pitchValue");
        const pitchBar = document.getElementById("pitchBar");

        const playButton = document.getElementById("playButton");
        const stopButton = document.getElementById("stopButton");
        const exportButton = document.getElementById("exportButton");

        const status = document.getElementById("status");
        const audioPlayer = document.getElementById("audioPlayer");

        let rawArrayBuffer = null;
        let audioObjectUrl = null;
        let isExporting = false;

        // Convert playback speed to pitch shift in semitones.
        function calculateSemitones(speed) {
            return 12 * Math.log2(speed);
        }

        // Update the speed and pitch display.
        function updateSpeedDisplay() {
            const speed = parseFloat(speedSlider.value);
            const semitones = calculateSemitones(speed);

            speedValue.textContent =
                `${Math.round(speed * 100)}%`;

            const sign = semitones > 0 ? "+" : "";

            pitchValue.textContent =
                `${sign}${semitones.toFixed(2)} semitones`;

            // The bar represents the range from -12 to +12 semitones.
            const normalized = (semitones + 12) / 24;
            const center = 0.5;

            if (normalized >= center) {
                pitchBar.style.left = "50%";
                pitchBar.style.width =
                    `${(normalized - center) * 100}%`;
            } else {
                pitchBar.style.left = `${normalized * 100}%`;
                pitchBar.style.width =
                    `${(center - normalized) * 100}%`;
            }

            // Keep the preview in sync with the export.
            audioPlayer.playbackRate = speed;

            // Disable pitch preservation so speed also changes pitch.
            if ("preservesPitch" in audioPlayer) {
                audioPlayer.preservesPitch = false;
            }

            if ("webkitPreservesPitch" in audioPlayer) {
                audioPlayer.webkitPreservesPitch = false;
            }

            if ("mozPreservesPitch" in audioPlayer) {
                audioPlayer.mozPreservesPitch = false;
            }
        }

        function showStatus(message, type = "") {
            status.textContent = message;
            status.className = "status";

            if (type) {
                status.classList.add(type);
            }
        }

        // Load the selected audio file.
        fileInput.addEventListener("change", (event) => {
            const file = event.target.files[0];

            if (!file) {
                return;
            }

            if (audioObjectUrl) {
                URL.revokeObjectURL(audioObjectUrl);
            }

            rawArrayBuffer = null;
            audioPlayer.pause();
            audioPlayer.currentTime = 0;

            fileName.textContent = file.name;
            showStatus("Loading audio...");

            const reader = new FileReader();

            reader.onload = () => {
                rawArrayBuffer = reader.result;

                audioObjectUrl = URL.createObjectURL(file);
                audioPlayer.src = audioObjectUrl;
                audioPlayer.load();

                playButton.disabled = false;
                stopButton.disabled = false;
                exportButton.disabled = false;

                updateSpeedDisplay();
                showStatus("Audio loaded successfully.", "success");
            };

            reader.onerror = () => {
                showStatus("Could not read the selected file.", "error");
            };

            reader.readAsArrayBuffer(file);
        });

        // Update speed and pitch when the slider changes.
        speedSlider.addEventListener("input", () => {
            updateSpeedDisplay();
        });

        // Start playback.
        playButton.addEventListener("click", async () => {
            if (!audioPlayer.src) {
                return;
            }

            try {
                updateSpeedDisplay();
                await audioPlayer.play();
                showStatus("Playing audio...");
            } catch (error) {
                showStatus(
                    "Playback failed: " + error.message,
                    "error"
                );
            }
        });

        // Stop playback and reset to the beginning.
        stopButton.addEventListener("click", () => {
            audioPlayer.pause();
            audioPlayer.currentTime = 0;
            showStatus("Playback stopped.");
        });

        // Export the audio with the selected speed and pitch.
        exportButton.addEventListener("click", async () => {
            if (!rawArrayBuffer || isExporting) {
                return;
            }

            isExporting = true;
            exportButton.disabled = true;
            playButton.disabled = true;

            showStatus("Rendering audio... Please wait.");

            const currentSpeed = parseFloat(speedSlider.value);

            try {
                // Decode the original audio file.
                const decodeContext = new (
                    window.AudioContext ||
                    window.webkitAudioContext
                )();

                const audioBuffer = await decodeContext.decodeAudioData(
                    rawArrayBuffer.slice(0)
                );

                await decodeContext.close();

                // Calculate the output length based on playback speed.
                // Slower playback produces a longer audio file.
                // Faster playback produces a shorter audio file.
                const outputLength = Math.ceil(
                    audioBuffer.length / currentSpeed
                ) + 1;

                // Create an offline context for rendering.
                const offlineContext = new OfflineAudioContext(
                    audioBuffer.numberOfChannels,
                    outputLength,
                    audioBuffer.sampleRate
                );

                const source = offlineContext.createBufferSource();

                source.buffer = audioBuffer;

                // This changes both speed and pitch naturally.
                source.playbackRate.value = currentSpeed;

                source.connect(offlineContext.destination);
                source.start(0);

                // Render the processed audio.
                const renderedBuffer =
                    await offlineContext.startRendering();

                // Convert the rendered audio to a WAV file.
                const wavBlob = bufferToWav(renderedBuffer);

                // Create a temporary download link.
                const downloadUrl = URL.createObjectURL(wavBlob);
                const link = document.createElement("a");

                link.href = downloadUrl;
                link.download = "audio_speed_shifted.wav";

                document.body.appendChild(link);
                link.click();
                link.remove();

                // Release the temporary URL after the download starts.
                setTimeout(() => {
                    URL.revokeObjectURL(downloadUrl);
                }, 1000);

                showStatus("WAV export completed!", "success");
            } catch (error) {
                console.error(error);

                showStatus(
                    "Export failed: " + error.message,
                    "error"
                );
            } finally {
                isExporting = false;
                exportButton.disabled = !rawArrayBuffer;
                playButton.disabled = !rawArrayBuffer;
            }
        });

        // Convert an AudioBuffer into a standard 16-bit PCM WAV file.
        function bufferToWav(buffer) {
            const numChannels = buffer.numberOfChannels;
            const sampleRate = buffer.sampleRate;
            const bitsPerSample = 16;

            const bytesPerSample = bitsPerSample / 8;
            const blockAlign = numChannels * bytesPerSample;

            const dataLength =
                buffer.length * numChannels * bytesPerSample;

            const wavBuffer = new ArrayBuffer(44 + dataLength);
            const view = new DataView(wavBuffer);

            // Write a string into the WAV header.
            function writeString(offset, string) {
                for (let i = 0; i < string.length; i++) {
                    view.setUint8(offset + i, string.charCodeAt(i));
                }
            }

            // RIFF header.
            writeString(0, "RIFF");
            view.setUint32(4, 36 + dataLength, true);
            writeString(8, "WAVE");

            // Format chunk.
            writeString(12, "fmt ");
            view.setUint32(16, 16, true);
            view.setUint16(20, 1, true); // PCM format
            view.setUint16(22, numChannels, true);
            view.setUint32(24, sampleRate, true);
            view.setUint32(
                28,
                sampleRate * blockAlign,
                true
            );
            view.setUint16(32, blockAlign, true);
            view.setUint16(34, bitsPerSample, true);

            // Data chunk.
            writeString(36, "data");
            view.setUint32(40, dataLength, true);

            // Get the audio data for each channel.
            const channels = [];

            for (let channel = 0; channel < numChannels; channel++) {
                channels.push(buffer.getChannelData(channel));
            }

            // Interleave channels and convert float samples to 16-bit PCM.
            let offset = 44;

            for (let i = 0; i < buffer.length; i++) {
                for (let channel = 0; channel < numChannels; channel++) {
                    let sample = channels[channel][i];

                    // Clamp samples to the valid range.
                    sample = Math.max(-1, Math.min(1, sample));

                    const pcmSample = sample < 0
                        ? Math.round(sample * 0x8000)
                        : Math.round(sample * 0x7FFF);

                    view.setInt16(offset, pcmSample, true);
                    offset += 2;
                }
            }

            return new Blob(
                [wavBuffer],
                { type: "audio/wav" }
            );
        }

        // Initialize the display.
        updateSpeedDisplay();
    </script>
</body>
</html>
