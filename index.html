<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Audio Speed Shifter</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px 16px;
            min-height: 100vh;

            font-family: Arial, sans-serif;

            background: #121212;
            color: #f5f5f5;

            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .container {
            width: 100%;
            max-width: 700px;

            padding: 30px;

            background: #1e1e1e;
            border: 1px solid #333;
            border-radius: 16px;

            box-shadow:
                0 8px 30px rgba(0, 0, 0, 0.35);
        }

        h1 {
            margin: 0 0 25px;

            text-align: center;
            font-size: 26px;
        }

        .section {
            margin-bottom: 25px;
            padding: 20px;

            background: #282828;
            border-radius: 12px;
        }

        .section h2 {
            margin: 0 0 16px;
            font-size: 18px;
        }

        input[type="file"] {
            width: 100%;
            padding: 12px;

            background: #333;
            border: 1px solid #444;
            border-radius: 8px;

            color: #fff;
        }

        .file-name {
            margin-top: 10px;

            color: #aaa;
            font-size: 14px;

            overflow-wrap: anywhere;
        }

        .speed-header {
            display: flex;
            justify-content: space-between;
            align-items: center;

            margin-bottom: 15px;
        }

        .speed-value {
            font-size: 24px;
            font-weight: bold;
            color: #4cafef;
        }

        input[type="range"] {
            width: 100%;
            accent-color: #4cafef;
            cursor: pointer;
        }

        .range-labels {
            display: flex;
            justify-content: space-between;

            margin-top: 8px;

            color: #aaa;
            font-size: 12px;
        }

        .pitch-info {
            margin-top: 22px;
            text-align: center;
        }

        .pitch-value {
            margin-bottom: 12px;

            font-size: 22px;
            font-weight: bold;
        }

        .pitch-bar-container {
            position: relative;

            width: 100%;
            height: 14px;

            background: #444;
            border-radius: 10px;

            overflow: hidden;
        }

        .pitch-center {
            position: absolute;

            top: 0;
            left: 50%;

            width: 2px;
            height: 100%;

            background: #fff;

            z-index: 2;
        }

        .pitch-bar {
            position: absolute;

            top: 0;
            left: 50%;

            height: 100%;
            width: 0;

            background: #4cafef;
        }

        .pitch-description {
            margin-top: 10px;

            color: #aaa;
            font-size: 13px;
        }

        .controls {
            display: flex;
            gap: 12px;

            margin-top: 20px;
        }

        button {
            flex: 1;

            padding: 13px 16px;

            border: none;
            border-radius: 8px;

            background: #4cafef;
            color: #111;

            font-size: 15px;
            font-weight: bold;

            cursor: pointer;

            transition: background 0.2s;
        }

        button:hover:not(:disabled) {
            background: #72c1f5;
        }

        button:disabled {
            background: #555;
            color: #aaa;
            cursor: not-allowed;
        }

        button.secondary {
            background: #444;
            color: #fff;
        }

        button.secondary:hover:not(:disabled) {
            background: #555;
        }

        .status {
            margin-top: 18px;
            min-height: 20px;

            color: #aaa;
            font-size: 14px;

            text-align: center;

            overflow-wrap: anywhere;
        }

        .status.error {
            color: #ff6b6b;
        }

        .status.success {
            color: #76d28b;
        }

        .progress {
            display: none;

            width: 100%;
            height: 8px;

            margin-top: 15px;

            background: #444;
            border-radius: 10px;

            overflow: hidden;
        }

        .progress-bar {
            width: 0;
            height: 100%;

            background: #4cafef;

            transition: width 0.05s linear;
        }

        @media (max-width: 500px) {
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 22px;
            }

            .controls {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

<main class="container">

    <h1>Audio Speed Shifter</h1>


    <!-- Audio file -->
    <section class="section">

        <h2>Audio File</h2>

        <input
            type="file"
            id="fileInput"
            accept="audio/*"
        >

        <div
            class="file-name"
            id="fileName"
        >
            No file selected
        </div>

    </section>


    <!-- Speed -->
    <section class="section">

        <h2>Speed</h2>

        <div class="speed-header">

            <label for="speedSlider">
                Playback Speed
            </label>

            <span
                class="speed-value"
                id="speedValue"
            >
                100%
            </span>

        </div>


        <input
            type="range"
            id="speedSlider"
            min="0.5"
            max="2"
            step="0.05"
            value="1"
        >


        <div class="range-labels">
            <span>50%</span>
            <span>100%</span>
            <span>150%</span>
            <span>200%</span>
        </div>


        <div class="pitch-info">

            <div
                class="pitch-value"
                id="pitchValue"
            >
                Pitch: unchanged
            </div>

            <div class="pitch-bar-container">

                <div class="pitch-center"></div>

                <div
                    class="pitch-bar"
                    id="pitchBar"
                ></div>

            </div>

            <div class="pitch-description">
                Speed changes while pitch remains unchanged.
            </div>

        </div>

    </section>


    <!-- Playback -->
    <section class="section">

        <h2>Playback & Export</h2>

        <div class="controls">

            <button
                id="playButton"
                disabled
            >
                Play
            </button>

            <button
                id="stopButton"
                class="secondary"
                disabled
            >
                Stop
            </button>

        </div>


        <div class="controls">

            <button
                id="exportButton"
                disabled
            >
                Export as WAV
            </button>

        </div>


        <div class="progress" id="progress">
            <div
                class="progress-bar"
                id="progressBar"
            ></div>
        </div>


        <div
            class="status"
            id="status"
        >
            Load an audio file to get started.
        </div>

    </section>

</main>


<script>

/*
 * ============================================================
 * Audio Speed Shifter
 * ============================================================
 *
 * This implementation performs actual time stretching.
 *
 * Unlike playbackRate:
 *
 *     playbackRate -> speed + pitch
 *
 * this algorithm:
 *
 *     time stretching -> speed only
 *
 * The original pitch is therefore preserved.
 *
 * The processor uses a WSOLA-style overlap/add algorithm.
 * Everything is contained inside this single HTML file.
 * ============================================================
 */


/*
 * ============================================================
 * DOM
 * ============================================================
 */

const fileInput =
    document.getElementById("fileInput");

const fileName =
    document.getElementById("fileName");

const speedSlider =
    document.getElementById("speedSlider");

const speedValue =
    document.getElementById("speedValue");

const pitchValue =
    document.getElementById("pitchValue");

const pitchBar =
    document.getElementById("pitchBar");

const playButton =
    document.getElementById("playButton");

const stopButton =
    document.getElementById("stopButton");

const exportButton =
    document.getElementById("exportButton");

const status =
    document.getElementById("status");

const progress =
    document.getElementById("progress");

const progressBar =
    document.getElementById("progressBar");


/*
 * ============================================================
 * State
 * ============================================================
 */

let audioContext = null;

let originalBuffer = null;

let processedBuffer = null;

let sourceNode = null;

let isPlaying = false;

let isProcessing = false;

let processingToken = 0;


/*
 * ============================================================
 * Utility
 * ============================================================
 */

function getAudioContext() {

    if (!audioContext) {

        audioContext = new (
            window.AudioContext ||
            window.webkitAudioContext
        )();
    }

    return audioContext;
}


function showStatus(
    message,
    type = ""
) {

    status.textContent = message;

    status.className = "status";

    if (type) {
        status.classList.add(type);
    }
}


/*
 * ============================================================
 * Speed UI
 * ============================================================
 */

function updateSpeedDisplay() {

    const speed =
        parseFloat(speedSlider.value);


    speedValue.textContent =
        `${Math.round(speed * 100)}%`;


    /*
     * The resulting pitch is always zero
     * because we are doing real time stretching.
     */

    pitchValue.textContent =
        "Pitch: unchanged";


    pitchBar.style.left =
        "50%";

    pitchBar.style.width =
        "0%";
}


speedSlider.addEventListener(
    "input",
    updateSpeedDisplay
);


/*
 * ============================================================
 * Audio loading
 * ============================================================
 */

fileInput.addEventListener(
    "change",
    async event => {

        const file =
            event.target.files[0];

        if (!file) {
            return;
        }


        try {

            stopPlayback();


            showStatus(
                "Loading audio..."
            );


            const context =
                getAudioContext();


            if (
                context.state ===
                "suspended"
            ) {

                await context.resume();
            }


            const arrayBuffer =
                await file.arrayBuffer();


            originalBuffer =
                await context.decodeAudioData(
                    arrayBuffer
                );


            processedBuffer =
                null;


            fileName.textContent =
                file.name;


            playButton.disabled =
                false;

            stopButton.disabled =
                false;

            exportButton.disabled =
                false;


            updateSpeedDisplay();


            showStatus(
                "Audio loaded successfully.",
                "success"
            );

        } catch (error) {

            console.error(error);

            showStatus(
                "Could not load audio: " +
                error.message,
                "error"
            );
        }
    }
);


/*
 * ============================================================
 * WSOLA Time Stretching
 * ============================================================
 *
 * WSOLA:
 *
 * Waveform Similarity Overlap Add
 *
 * The algorithm:
 *
 * 1. Takes overlapping windows from the source.
 * 2. Moves the analysis position according to speed.
 * 3. Searches for a similar waveform around the expected
 *    synthesis position.
 * 4. Crossfades the matching windows.
 *
 * Because the waveform cycles are preserved instead of
 * simply resampling the audio, the pitch remains approximately
 * unchanged.
 * ============================================================
 */

function timeStretch(
    inputBuffer,
    speed,
    onProgress,
    token
) {

    const channels =
        inputBuffer.numberOfChannels;

    const sampleRate =
        inputBuffer.sampleRate;

    const inputLength =
        inputBuffer.length;


    /*
     * At 1x no processing is necessary.
     */

    if (speed === 1) {

        const copy =
            new AudioBuffer({
                length: inputLength,
                numberOfChannels: channels,
                sampleRate: sampleRate
            });


        for (
            let channel = 0;
            channel < channels;
            channel++
        ) {

            copy
                .getChannelData(channel)
                .set(
                    inputBuffer.getChannelData(channel)
                );
        }


        return copy;
    }


    /*
     * Window size.
     *
     * 40 ms gives a reasonable compromise between
     * transient preservation and stable pitch.
     */

    const windowSize =
        Math.max(
            512,
            Math.round(
                sampleRate * 0.04
            )
        );


    /*
     * Make sure the window is even.
     */

    const N =
        windowSize % 2 === 0
            ? windowSize
            : windowSize + 1;


    /*
     * Half-overlap.
     */

    const overlap =
        Math.floor(N / 2);


    /*
     * Analysis hop.
     *
     * For 2x:
     *
     * 1024 output samples correspond to
     * 2048 input samples.
     *
     * For 0.5x:
     *
     * 512 output samples correspond to
     * 256 input samples.
     */

    const analysisHop =
        Math.max(
            1,
            Math.round(
                overlap * speed
            )
        );


    const synthesisHop =
        overlap;


    /*
     * Output length.
     */

    const outputLength =
        Math.ceil(
            inputLength / speed
        ) + N;


    /*
     * Create output arrays.
     */

    const outputChannels = [];

    const weight =
        new Float32Array(
            outputLength
        );


    for (
        let channel = 0;
        channel < channels;
        channel++
    ) {

        outputChannels.push(
            new Float32Array(
                outputLength
            )
        );
    }


    /*
     * Hann window.
     */

    const window =
        new Float32Array(N);


    for (
        let i = 0;
        i < N;
        i++
    ) {

        window[i] =
            0.5 -
            0.5 *
            Math.cos(
                (2 * Math.PI * i) /
                (N - 1)
            );
    }


    /*
     * Source channel data.
     */

    const inputChannels = [];

    for (
        let channel = 0;
        channel < channels;
        channel++
    ) {

        inputChannels.push(
            inputBuffer.getChannelData(
                channel
            )
        );
    }


    /*
     * Search radius for waveform matching.
     */

    const searchRadius =
        Math.floor(
            N * 0.25
        );


    /*
     * Initial positions.
     */

    let inputPosition = 0;

    let outputPosition = 0;

    let previousInputPosition = 0;


    /*
     * First frame.
     */

    while (
        inputPosition < inputLength &&
        outputPosition < outputLength
    ) {

        /*
         * Stop if another processing operation
         * has started.
         */

        if (
            token !== processingToken
        ) {

            return null;
        }


        /*
         * Find the best matching source position.
         */

        let bestPosition =
            Math.round(
                inputPosition
            );


        if (
            outputPosition > 0
        ) {

            const expected =
                Math.round(
                    previousInputPosition +
                    analysisHop
                );


            let bestScore =
                -Infinity;


            const minSearch =
                Math.max(
                    0,
                    expected - searchRadius
                );


            const maxSearch =
                Math.min(
                    inputLength - N,
                    expected + searchRadius
                );


            /*
             * Compare the beginning of the current
             * frame against the end of the previous frame.
             */

            for (
                let candidate = minSearch;
                candidate <= maxSearch;
                candidate += 4
            ) {

                let score = 0;


                /*
                 * Use mono correlation for matching.
                 */

                const referenceChannel =
                    inputChannels[0];


                const compareLength =
                    Math.min(
                        overlap,
                        inputLength -
                        previousInputPosition -
                        overlap,
                        inputLength -
                        candidate -
                        overlap
                    );


                if (
                    compareLength <= 16
                ) {
                    continue;
                }


                for (
                    let j = 0;
                    j < compareLength;
                    j += 4
                ) {

                    const a =
                        referenceChannel[
                            previousInputPosition +
                            j
                        ];

                    const b =
                        referenceChannel[
                            candidate +
                            j
                        ];


                    score +=
                        a * b;
                }


                if (
                    score > bestScore
                ) {

                    bestScore =
                        score;

                    bestPosition =
                        candidate;
                }
            }
        }


        /*
         * Store current position.
         */

        previousInputPosition =
            bestPosition;


        /*
         * Overlap-add frame.
         */

        for (
            let i = 0;
            i < N;
            i++
        ) {

            const sourceIndex =
                bestPosition + i;

            const destinationIndex =
                outputPosition + i;


            if (
                sourceIndex >= inputLength ||
                destinationIndex >= outputLength
            ) {
                break;
            }


            const windowValue =
                window[i];


            weight[destinationIndex] +=
                windowValue;


            for (
                let channel = 0;
                channel < channels;
                channel++
            ) {

                outputChannels[channel][
                    destinationIndex
                ] +=
                    inputChannels[channel][
                        sourceIndex
                    ] *
                    windowValue;
            }
        }


        /*
         * Move through input and output separately.
         */

        inputPosition =
            bestPosition +
            analysisHop;


        outputPosition +=
            synthesisHop;


        /*
         * Progress.
         */

        if (
            onProgress &&
            outputPosition % 16384 < synthesisHop
        ) {

            onProgress(
                Math.min(
                    1,
                    inputPosition /
                    inputLength
                )
            );
        }
    }


    /*
     * Normalize overlap-add result.
     */

    for (
        let i = 0;
        i < outputLength;
        i++
    ) {

        const normalization =
            weight[i];


        if (
            normalization > 0.00001
        ) {

            const inverse =
                1 /
                normalization;


            for (
                let channel = 0;
                channel < channels;
                channel++
            ) {

                outputChannels[channel][i] *=
                    inverse;
            }

        } else {

            for (
                let channel = 0;
                channel < channels;
                channel++
            ) {

                outputChannels[channel][i] = 0;
            }
        }
    }


    /*
     * Remove the extra window at the end.
     */

    let finalLength =
        Math.ceil(
            inputLength / speed
        );


    finalLength =
        Math.min(
            finalLength,
            outputLength
        );


    /*
     * Create AudioBuffer.
     */

    const result =
        new AudioBuffer({
            length: finalLength,
            numberOfChannels: channels,
            sampleRate: sampleRate
        });


    for (
        let channel = 0;
        channel < channels;
        channel++
    ) {

        result
            .getChannelData(channel)
            .set(
                outputChannels[channel].subarray(
                    0,
                    finalLength
                )
            );
    }


    if (onProgress) {
        onProgress(1);
    }


    return result;
}


/*
 * ============================================================
 * Process current audio
 * ============================================================
 */

async function processAudio() {

    if (
        !originalBuffer ||
        isProcessing
    ) {
        return null;
    }


    isProcessing = true;

    processingToken++;

    const token =
        processingToken;


    const speed =
        parseFloat(
            speedSlider.value
        );


    progress.style.display =
        "block";

    progressBar.style.width =
        "0%";


    try {

        /*
         * Yield to the browser before starting
         * CPU-intensive processing.
         */

        await new Promise(
            resolve =>
                setTimeout(
                    resolve,
                    20
                )
        );


        const result =
            timeStretch(
                originalBuffer,
                speed,
                value => {

                    progressBar.style.width =
                        `${value * 100}%`;

                },
                token
            );


        if (
            token !== processingToken
        ) {

            return null;
        }


        processedBuffer =
            result;


        return result;

    } finally {

        isProcessing = false;

        setTimeout(
            () => {

                progress.style.display =
                    "none";

            },
            300
        );
    }
}


/*
 * ============================================================
 * Playback
 * ============================================================
 */

async function playProcessedAudio() {

    if (
        !originalBuffer ||
        isProcessing
    ) {
        return;
    }


    stopPlayback();


    showStatus(
        "Processing audio..."
    );


    const buffer =
        await processAudio();


    if (!buffer) {
        return;
    }


    const context =
        getAudioContext();


    if (
        context.state ===
        "suspended"
    ) {

        await context.resume();
    }


    /*
     * Create a normal source at 1x.
     *
     * IMPORTANT:
     *
     * The audio has already been time-stretched.
     *
     * Therefore playbackRate MUST remain 1.
     *
     * This is what prevents the browser from changing
     * the pitch again.
     */

    sourceNode =
        context.createBufferSource();

    sourceNode.buffer =
        buffer;

    sourceNode.playbackRate.value =
        1;

    sourceNode.connect(
        context.destination
    );


    sourceNode.onended =
        () => {

            isPlaying = false;

            sourceNode = null;

            showStatus(
                "Playback finished."
            );
        };


    sourceNode.start();

    isPlaying = true;


    showStatus(
        `Playing at ${Math.round(
            parseFloat(speedSlider.value) * 100
        )}% with unchanged pitch.`
    );
}


/*
 * Play button
 */

playButton.addEventListener(
    "click",
    playProcessedAudio
);


/*
 * Stop playback
 */

function stopPlayback() {

    processingToken++;


    if (sourceNode) {

        try {
            sourceNode.stop();
        } catch (_) {}

        try {
            sourceNode.disconnect();
        } catch (_) {}

        sourceNode = null;
    }


    isPlaying = false;
}


stopButton.addEventListener(
    "click",
    () => {

        stopPlayback();

        showStatus(
            "Playback stopped."
        );
    }
);


/*
 * ============================================================
 * WAV encoder
 * ============================================================
 */

function bufferToWav(buffer) {

    const channels =
        buffer.numberOfChannels;

    const sampleRate =
        buffer.sampleRate;

    const bytesPerSample =
        2;

    const blockAlign =
        channels *
        bytesPerSample;

    const dataLength =
        buffer.length *
        blockAlign;


    const arrayBuffer =
        new ArrayBuffer(
            44 + dataLength
        );

    const view =
        new DataView(
            arrayBuffer
        );


    function writeString(
        offset,
        string
    ) {

        for (
            let i = 0;
            i < string.length;
            i++
        ) {

            view.setUint8(
                offset + i,
                string.charCodeAt(i)
            );
        }
    }


    /*
     * RIFF
     */

    writeString(
        0,
        "RIFF"
    );

    view.setUint32(
        4,
        36 + dataLength,
        true
    );

    writeString(
        8,
        "WAVE"
    );


    /*
     * fmt
     */

    writeString(
        12,
        "fmt "
    );

    view.setUint32(
        16,
        16,
        true
    );

    view.setUint16(
        20,
        1,
        true
    );

    view.setUint16(
        22,
        channels,
        true
    );

    view.setUint32(
        24,
        sampleRate,
        true
    );

    view.setUint32(
        28,
        sampleRate * blockAlign,
        true
    );

    view.setUint16(
        32,
        blockAlign,
        true
    );

    view.setUint16(
        34,
        16,
        true
    );


    /*
     * data
     */

    writeString(
        36,
        "data"
    );

    view.setUint32(
        40,
        dataLength,
        true
    );


    /*
     * Channel data
     */

    const channelData = [];


    for (
        let channel = 0;
        channel < channels;
        channel++
    ) {

        channelData.push(
            buffer.getChannelData(
                channel
            )
        );
    }


    /*
     * Interleave and convert to 16-bit PCM.
     */

    let offset = 44;


    for (
        let i = 0;
        i < buffer.length;
        i++
    ) {

        for (
            let channel = 0;
            channel < channels;
            channel++
        ) {

            let sample =
                channelData[channel][i];


            sample =
                Math.max(
                    -1,
                    Math.min(
                        1,
                        sample
                    )
                );


            const pcm =
                sample < 0
                    ? Math.round(
                        sample * 0x8000
                    )
                    : Math.round(
                        sample * 0x7FFF
                    );


            view.setInt16(
                offset,
                pcm,
                true
            );


            offset += 2;
        }
    }


    return new Blob(
        [arrayBuffer],
        {
            type: "audio/wav"
        }
    );
}


/*
 * ============================================================
 * Export
 * ============================================================
 */

exportButton.addEventListener(
    "click",
    async () => {

        if (
            !originalBuffer ||
            isProcessing
        ) {
            return;
        }


        try {

            exportButton.disabled =
                true;

            playButton.disabled =
                true;


            showStatus(
                "Processing audio for export..."
            );


            const buffer =
                await processAudio();


            if (!buffer) {
                return;
            }


            showStatus(
                "Creating WAV file..."
            );


            const wav =
                bufferToWav(
                    buffer
                );


            const url =
                URL.createObjectURL(
                    wav
                );


            const link =
                document.createElement("a");


            link.href =
                url;

            link.download =
                "audio_speed_shifted.wav";


            document.body.appendChild(
                link
            );

            link.click();

            link.remove();


            setTimeout(
                () => {

                    URL.revokeObjectURL(
                        url
                    );

                },
                1000
            );


            showStatus(
                "WAV export completed successfully.",
                "success"
            );

        } catch (error) {

            console.error(error);

            showStatus(
                "Export failed: " +
                error.message,
                "error"
            );

        } finally {

            exportButton.disabled =
                !originalBuffer;

            playButton.disabled =
                !originalBuffer;
        }
    }
);


/*
 * ============================================================
 * Initialize
 * ============================================================
 */

updateSpeedDisplay();

</script>

</body>
</html>
